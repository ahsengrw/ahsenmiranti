# Codemagic CI/CD configuration for Meranti Beading
# Reference: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Define these in Codemagic UI: APP_STORE_CONNECT_KEY, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings
        script: |
          keychain initialize
          # Fetch profiles and certificates from App Store Connect integration
          app-store-connect fetch-signing-files "com.meranti.beading.merantibeading" --project-id " Runner" --type IOS_APP_STORE --install
          keychain add-certificates
      - name: Set up project configuration
        script: |
          # Nuclear clean to remove all Windows paths and remnants
          rm -rf ios/Flutter
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies
          # Disable Swift Package Manager to avoid conflicts with Google Maps
          flutter config --no-enable-ios-swift-package-manager
          flutter clean
          flutter pub get
          # Generate icons for iOS (mandatory 1024x1024 store icon)
          dart run flutter_launcher_icons
      - name: Install CocoaPods
        script: |
          cd ios
          # Ensure repository is fresh
          pod repo update
          pod install
      - name: Build IPA for App Store
        script: |
          # Use Codemagic build number for consistency, or fetch from Apple with fallback
          # $BUILD_NUMBER is automatically provided by Codemagic and increments per build
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-method=app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Required for publishing
        # issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        # private_key: $APP_STORE_CONNECT_KEY
        submit_to_testflight: true
        submit_to_review: false
